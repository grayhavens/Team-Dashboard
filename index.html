<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1D1F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Teams">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>My Teams</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="board">

  <div class="masthead">
    <h1>My Teams</h1>
    <div class="tally">Leagues Followed<b id="team-tally">— Leagues · — Teams</b></div>
  </div>

  <div id="view-board" class="view active">
    <div class="filter-chips" id="filter-chips"></div>
    <div class="leagues" id="leagues"></div>
  </div>

  <div id="view-standings" class="view">
    <div style="margin-bottom:16px; font-size:12px; color:var(--sub);">Tap any team below to mark off scoring events as they happen this season.</div>
    <div id="standings-content"></div>
  </div>

</div>

<!-- Team / league detail modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeTeamModal()">
  <div class="modal" id="modal-content">
    <!-- content injected by JS -->
  </div>
</div>

<nav class="tab-bar">
  <button class="tab-btn active" data-view="board" onclick="switchView('board')"><span class="dot"></span>Board</button>
  <button class="tab-btn" data-view="standings" onclick="switchView('standings')"><span class="dot"></span>Standings</button>
</nav>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
