<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boxscore">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Boxscore</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="board">

  <div id="view-board" class="view active">
    <div class="page-header">
      <div class="page-header-top">
        <img class="app-logo" src="icons/logo-header.png" alt="">
        <h1>Boxscore</h1>
      </div>
      <div class="page-sub" id="team-tally">&mdash; teams &middot; &mdash; leagues</div>
    </div>
    <div class="filter-chips" id="filter-chips"></div>
    <div class="leagues" id="leagues"></div>
  </div>

  <div id="view-standings" class="view">
    <div class="page-header">
      <h1>Standings</h1>
      <div class="page-sub">Tap a team to update its checklist</div>
    </div>
    <div id="standings-content"></div>
  </div>

</div>

<!-- Team / league detail modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeTeamModal()">
  <div class="modal" id="modal-content">
    <!-- content injected by JS -->
  </div>
</div>

<nav class="tab-bar">
  <button class="tab-btn active" data-view="board" onclick="switchView('board')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"></rect><rect x="13" y="3" width="8" height="8" rx="2"></rect><rect x="3" y="13" width="8" height="8" rx="2"></rect><rect x="13" y="13" width="8" height="8" rx="2"></rect></svg>
    <span class="tab-label">Board</span>
  </button>
  <button class="tab-btn" data-view="standings" onclick="switchView('standings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V13"></path><path d="M12 20V7"></path><path d="M20 20V10"></path></svg>
    <span class="tab-label">Standings</span>
  </button>
</nav>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
